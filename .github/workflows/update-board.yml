name: Update macro board
on:
  schedule:
    - cron: '50 12-22 * * 1-5'   # hourly at :50, weekdays, ~7:50am–5:50pm CT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-board.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add board.json
          git diff --staged --quiet || (git commit -m "Update board data" && git push)
