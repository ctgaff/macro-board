name: Update macro board
on:
  schedule:
    - cron: '*/30 11-22 * * 1-5'   # every 30 min, weekdays, ~7am–6pm ET
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-board.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add board.json
          git diff --staged --quiet || (git commit -m "Update board data" && git push)
